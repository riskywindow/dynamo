apiVersion: v1
kind: Pod
metadata:
  name: rp-v031f-a
  namespace: <namespace>
  labels: {app: rp-v031f}
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 21600
  priorityClassName: <priority-class>
  terminationGracePeriodSeconds: 5
  runtimeClassName: nvidia
  nodeSelector: {kubernetes.io/hostname: <gpu-node>}
  tolerations:
  - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
  imagePullSecrets: [{name: <image-pull-secret>}]
  containers:
  - name: main
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0
    command: ["sleep", "21500"]
    env:
    - {name: NVIDIA_VISIBLE_DEVICES, value: all}
    - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
    - {name: CUDA_DEVICE_ORDER, value: PCI_BUS_ID}
    - {name: HF_HUB_OFFLINE, value: "1"}
    - {name: HF_HUB_DISABLE_XET, value: "1"}
    - {name: VLLM_WORKER_MULTIPROC_METHOD, value: spawn}
    - {name: PYTHONUNBUFFERED, value: "1"}
    resources:
      requests: {cpu: "64", memory: 500Gi, nvidia.com/gpu: "4"}
      limits:   {cpu: "64", memory: 500Gi, nvidia.com/gpu: "4"}
    volumeMounts:
    - {name: model-cache, mountPath: /model-cache, readOnly: true}
    - {name: shm, mountPath: /dev/shm}
    - {name: results, mountPath: /results}
  volumes:
  - {name: model-cache, persistentVolumeClaim: {claimName: <model-pvc>, readOnly: true}}
  - {name: shm, emptyDir: {medium: Memory, sizeLimit: 64Gi}}
  - {name: results, emptyDir: {sizeLimit: 200Gi}}
