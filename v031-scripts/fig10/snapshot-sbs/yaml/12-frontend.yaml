# Dynamo frontend + client pod (CPU only). Needs the model dir for tokenizer/config (the infra pod's frontend
# container has no model mount and cannot materialize the model; it is left idle and unused).
apiVersion: v1
kind: Pod
metadata:
  name: rp-snap-sbs-frontend
  namespace: <namespace>
  labels: {app: rp-snap-sbs, role: frontend}
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 21600
  priorityClassName: <priority-class>
  terminationGracePeriodSeconds: 5
  nodeSelector: {kubernetes.io/hostname: <gpu-node>}
  tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
  imagePullSecrets: [{name: <image-pull-secret>}]
  containers:
  - name: frontend
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0
    command: ["python3", "-m", "dynamo.frontend", "--http-port", "8000"]
    env:
    - {name: NVIDIA_VISIBLE_DEVICES, value: void}
    - {name: ETCD_ENDPOINTS, value: "http://rp-snap-sbs-infra:2379"}
    - {name: NATS_SERVER, value: "nats://rp-snap-sbs-infra:4222"}
    - {name: HF_HUB_OFFLINE, value: "1"}
    resources: {requests: {cpu: "8", memory: 16Gi}, limits: {cpu: "16", memory: 32Gi}}
    volumeMounts:
    - {name: model-cache, mountPath: /model-cache, readOnly: true}
    - {name: results, mountPath: /results}
  volumes:
  - {name: model-cache, persistentVolumeClaim: {claimName: <model-pvc>, readOnly: true}}
  - {name: results, emptyDir: {}}
