apiVersion: v1
kind: Pod
metadata:
  name: rp-snap-sbs-source
  namespace: <namespace>
  labels: {app: rp-snap-sbs, role: engine, engine-id: "0"}
  annotations: {nvidia.com/snapshot-multi-gpu: enabled}
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 21600
  priorityClassName: <priority-class>
  terminationGracePeriodSeconds: 5
  runtimeClassName: nvidia
  nodeSelector: {kubernetes.io/hostname: <gpu-node>}
  tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
  imagePullSecrets: [{name: <image-pull-secret>}]
  securityContext:
    seccompProfile: {type: Localhost, localhostProfile: profiles/block-iouring.json}
  initContainers:
  # Same injection the snapshot operator does for SnapshotJob pods with nvidia.com/snapshot-multi-gpu: enabled
  # (cuInterpose lets cuda-checkpoint capture CUDA memory shared between the TP ranks).
  - name: snapshot-cuda-install
    image: ghcr.io/ai-dynamo/snapshot/agent:v0.2.0
    command: [/bin/cp]
    args: [--preserve=mode, --, /usr/local/lib/snapshot/libcuinterpose.so, /usr/local/lib/snapshot/libcuinterpose_core.so, /usr/local/bin/cuinterpose-launch, /tmp/snapshot-cuda/]
    volumeMounts: [{name: snapshot-cuda, mountPath: /tmp/snapshot-cuda}]
  containers:
  - name: main
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0
    command: [/tmp/snapshot-cuda/cuinterpose-launch, --library, /tmp/snapshot-cuda/libcuinterpose.so, --, /bin/bash, -c]
    args:
    - |
      export LD_LIBRARY_PATH=/shared/compat/usr/local/cuda-13.4/compat:$LD_LIBRARY_PATH
      exec python3 -m dynamo.vllm --model /model-cache/hub/models--nvidia--GLM-5.2-NVFP4/snapshots/aec724e8c7b8ee9db3b48c01c320f63f9cdaf8aa --served-model-name glm-5.2-nvfp4 \
        --tensor-parallel-size 4 --enable-expert-parallel --max-model-len 40960 \
        --gpu-memory-utilization 0.8 --num-gpu-blocks-override 5641 --block-size 64 \
        --max-num-batched-tokens 8192 --max-num-seqs 1024 --enable-prefix-caching \
        --enable-chunked-prefill --seed 0 --trust-remote-code --disable-custom-all-reduce
    env:
    - {name: NVIDIA_VISIBLE_DEVICES, value: all}
    - {name: VLLM_ALLREDUCE_USE_FLASHINFER, value: "0"}
    - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
    - {name: CUDA_DEVICE_ORDER, value: PCI_BUS_ID}
    - {name: DYN_GMS_USE_V1, value: "true"}
    - {name: GMS_SOCKET_DIR, value: /shared/gms}
    - {name: FAILOVER_LOCK_PATH, value: /shared/locks/failover.lock}
    - {name: ENGINE_ID, value: "0"}
    - {name: CONTAINER_NAME, value: main}
    - {name: SNAPSHOT_CONTROL_DIR, value: /snapshot-control}
    - {name: DYN_SNAPSHOT_CONTROL_DIR, value: /snapshot-control}
    - {name: ETCD_ENDPOINTS, value: "http://rp-snap-sbs-infra:2379"}
    - {name: NATS_SERVER, value: "nats://rp-snap-sbs-infra:4222"}
    - {name: HF_HUB_OFFLINE, value: "1"}
    - {name: HF_HUB_DISABLE_XET, value: "1"}
    - {name: VLLM_WORKER_MULTIPROC_METHOD, value: spawn}
    - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
    - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
    - {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}
    # fig10-eval: Dynamo system server on the worker -> /metrics with vllm:* (read from restore context after restore)
    - {name: DYN_SYSTEM_PORT, value: "8081"}

    readinessProbe: {exec: {command: [cat, /snapshot-control/ready-for-snapshot]}, periodSeconds: 2, failureThreshold: 3000}
    resources:
      requests: {cpu: "16", memory: 64Gi}
      limits: {cpu: "32", memory: 400Gi}
    volumeMounts:
    - {name: snapshot-control, mountPath: /snapshot-control, subPath: main}
    - {name: tun, mountPath: /dev/net/tun}
    - {name: criu-work, mountPath: /var/criu-work}
    - {name: shared, mountPath: /shared}
    - {name: model-cache, mountPath: /model-cache, readOnly: true}
    - {name: shared-memory, mountPath: /dev/shm}
    - {name: snapshot-cuda, mountPath: /tmp/snapshot-cuda, readOnly: true}
  volumes:
  - {name: snapshot-control, emptyDir: {}}
  - {name: tun, hostPath: {path: /dev/net/tun, type: CharDevice}}
  - {name: criu-work, emptyDir: {}}
  - {name: shared, hostPath: {path: /tmp/rp-snap-sbs, type: DirectoryOrCreate}}
  - {name: model-cache, persistentVolumeClaim: {claimName: <model-pvc>, readOnly: true}}
  # Same shape as the Dynamo operator default (shared-memory emptyDir, 8Gi, at /dev/shm); vLLM TP4 needs >160 MiB.
  - {name: shared-memory, emptyDir: {medium: Memory, sizeLimit: 8Gi}}
  - {name: snapshot-cuda, emptyDir: {}}
